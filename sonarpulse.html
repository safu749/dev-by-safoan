<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonar Pulse - Responsive Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05050a;
      color: #e0e0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #ui {
      margin-bottom: 15px;
      text-align: center;
      user-select: none;
    }
    h1 {
      font-size: 24px;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }
    p {
      font-size: 13px;
      color: #8a8ab0;
      margin-top: 4px;
    }
    .status {
      margin-top: 8px;
      font-size: 15px;
      font-weight: bold;
    }
    canvas {
      background: #000003;
      border: 2px solid #1a1a3a;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      max-width: 95vw;
      max-height: 75vh;
      width: auto;
      height: auto;
      aspect-ratio: 7 / 5;
    }
  </style>
</head>
<body>

  <div id="ui">
    <h1>SONAR PULSE</h1>
    <p>Press [SPACE] or Click to release Sonar Wave | Move: [WASD] / [Arrows]</p>
    <div class="status" id="statusText">Level 1 - Navigate to the Green Core</div>
  </div>

  <canvas id="gameCanvas" width="800" height="570"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText");

    let level = 1;
    let gameOver = false;

    const player = {
      x: 50,
      y: 285,
      r: 7,
      speed: 3,
      vx: 0,
      vy: 0
    };

    const goal = {
      x: 740,
      y: 285,
      r: 16
    };

    let pulses = [];
    let walls = [];
    let hazards = [];
    const keys = {};

    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.code === "Space") {
        e.preventDefault();
        triggerPulse();
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    canvas.addEventListener("click", () => {
      triggerPulse();
    });

    function triggerPulse() {
      pulses.push({
        x: player.x,
        y: player.y,
        radius: 0,
        maxRadius: 260,
        speed: 5,
        alpha: 1.0
      });
    }

    function initLevel() {
      pulses = [];
      player.x = 50;
      player.y = canvas.height / 2;
      
      walls = [
        { x: 0, y: 0, w: canvas.width, h: 12 },
        { x: 0, y: canvas.height - 12, w: canvas.width, h: 12 },
        { x: 0, y: 0, w: 12, h: canvas.height },
        { x: canvas.width - 12, y: 0, w: 12, h: canvas.height }
      ];

      hazards = [];

      if (level === 1) {
        walls.push({ x: 240, y: 0, w: 22, h: 370 });
        walls.push({ x: 500, y: 200, w: 22, h: 370 });
        hazards.push({ x: 370, y: 120, r: 12, vy: 2.5, minY: 30, maxY: 540 });
      } else if (level === 2) {
        walls.push({ x: 180, y: 120, w: 22, h: 450 });
        walls.push({ x: 380, y: 0, w: 22, h: 420 });
        walls.push({ x: 580, y: 140, w: 22, h: 430 });
        hazards.push({ x: 280, y: 100, r: 13, vy: 3.5, minY: 30, maxY: 540 });
        hazards.push({ x: 480, y: 400, r: 13, vy: -3.5, minY: 30, maxY: 540 });
      } else {
        walls.push({ x: 200, y: 0, w: 22, h: 400 });
        walls.push({ x: 400, y: 170, w: 22, h: 400 });
        walls.push({ x: 600, y: 0, w: 22, h: 400 });
        for (let i = 0; i < Math.min(level + 1, 6); i++) {
          hazards.push({
            x: 110 + i * 120,
            y: 60 + (i * 90) % 350,
            r: 12,
            vy: 2.5 + i * 0.4,
            minY: 25,
            maxY: 545
          });
        }
      }

      triggerPulse();
    }

    function isVisible(x, y) {
      for (let p of pulses) {
        let dist = Math.hypot(p.x - x, p.y - y);
        if (Math.abs(dist - p.radius) < 40 || dist < 30) {
          return Math.max(0, p.alpha);
        }
      }
      return 0;
    }

    function update() {
      if (gameOver) return;

      player.vx = 0;
      player.vy = 0;
      if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.vy = -player.speed;
      if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.vy = player.speed;
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.vx = -player.speed;
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.vx = player.speed;

      let nextX = player.x + player.vx;
      let nextY = player.y + player.vy;

      let collideX = false;
      let collideY = false;

      for (let w of walls) {
        if (nextX + player.r > w.x && nextX - player.r < w.x + w.w &&
            player.y + player.r > w.y && player.y - player.r < w.y + w.h) {
          collideX = true;
        }
        if (player.x + player.r > w.x && player.x - player.r < w.x + w.w &&
            nextY + player.r > w.y && nextY - player.r < w.y + w.h) {
          collideY = true;
        }
      }

      if (!collideX) player.x = nextX;
      if (!collideY) player.y = nextY;

      for (let h of hazards) {
        h.y += h.vy;
        if (h.y - h.r < h.minY || h.y + h.r > h.maxY) {
          h.vy *= -1;
        }

        if (Math.hypot(player.x - h.x, player.y - h.y) < player.r + h.r) {
          statusText.textContent = "💥 Destroyed! Restarting level...";
          statusText.style.color = "#ff4d4d";
          initLevel();
          return;
        }
      }

      if (Math.hypot(player.x - goal.x, player.y - goal.y) < player.r + goal.r) {
        level++;
        statusText.textContent = `✨ Level ${level} Unlocked! Keep Going!`;
        statusText.style.color = "#00ffcc";
        initLevel();
        return;
      }

      for (let i = pulses.length - 1; i >= 0; i--) {
        let p = pulses[i];
        p.radius += p.speed;
        p.alpha = 1 - (p.radius / p.maxRadius);

        if (p.radius >= p.maxRadius) {
          pulses.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.fillStyle = "#020205";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let p of pulses) {
        ctx.save();
        ctx.strokeStyle = `rgba(0, 240, 255, ${p.alpha * 0.75})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      for (let w of walls) {
        let visibility = isVisible(w.x + w.w / 2, w.y + w.h / 2);
        if (visibility > 0) {
          ctx.fillStyle = `rgba(60, 75, 130, ${visibility})`;
          ctx.shadowColor = "#00f0ff";
          ctx.shadowBlur = 8;
          ctx.fillRect(w.x, w.y, w.w, w.h);
          ctx.shadowBlur = 0;
        }
      }

      for (let h of hazards) {
        let visibility = isVisible(h.x, h.y);
        if (visibility > 0) {
          ctx.save();
          ctx.fillStyle = `rgba(255, 50, 80, ${visibility})`;
          ctx.shadowColor = "#ff0055";
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      let goalVis = Math.max(0.2, isVisible(goal.x, goal.y));
      ctx.save();
      ctx.fillStyle = `rgba(0, 255, 170, ${goalVis})`;
      ctx.shadowColor = "#00ffaa";
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(goal.x, goal.y, goal.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#00f0ff";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initLevel();
    loop();
  </script>

  <p style="text-align: center; color: #ccc; font-size: 14px;">
    <b><em>this game was made by ai</em></b>
  </p>
</body>
</html>
